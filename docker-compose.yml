x-database-url: &database-url postgresql://approvals:local-only@db:5432/approvals

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: approvals
      POSTGRES_USER: approvals
      POSTGRES_PASSWORD: local-only
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U approvals -d approvals"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      target: migration
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    environment:
      DATABASE_URL: *database-url
      NODE_ENV: development
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
