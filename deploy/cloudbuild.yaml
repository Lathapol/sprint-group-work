steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '${_IMAGE_BASE}/app:${_TAG}', '.']
  - name: gcr.io/cloud-builders/docker
    args: ['build', '--target', 'migration', '-t', '${_IMAGE_BASE}/migration:${_TAG}', '.']
images:
  - '${_IMAGE_BASE}/app:${_TAG}'
  - '${_IMAGE_BASE}/migration:${_TAG}'
options:
  logging: CLOUD_LOGGING_ONLY
